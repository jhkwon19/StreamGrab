[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamgrab"
version = "0.3.0"
description = "Windows desktop and CLI tool for analyzing, saving, and converting web media"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StreamGrab contributors" }]
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "curl-cffi>=0.17.0",
    "brotli>=1.2.1",
    "certifi>=2026.10.23",
    "websockets>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
streamgrab = "streamgrab.cli:main"

[project.gui-scripts]
streamgrab-gui = "streamgrab.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
