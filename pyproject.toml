[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamgrab"
version = "0.2.0"
description = "Extensible command-line tool for analyzing and saving web media streams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "StreamGrab contributors" }]
dependencies = ["yt-dlp[default,curl-cffi]>=2026.8.18.122307.dev0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
streamgrab = "streamgrab.cli:main"

[project.gui-scripts]
streamgrab-gui = "streamgrab.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
